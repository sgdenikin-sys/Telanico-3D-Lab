name: Godot Web playable

on:
  workflow_dispatch:
  push:
    branches: [codex/telanico-overworld-v2, codex/telanico-overworld-v2-1, codex/telanico-v2-2-story-integration]
  pull_request:
    paths:
      - 'blender/scripts/**'
      - 'godot/**'
      - 'tools/**'
      - '.github/workflows/web-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BUILD_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      GODOT_VERSION: '4.6.3'
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy ripgrep
          blender --background --python-exit-code 1 --python-expr "import numpy; print(numpy.__version__)"
      - name: Install matching Godot editor and Web templates
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_release.zip' -d "$template_dir"
      - name: Generate island, test viewer, export and validate Web files
        run: bash tools/build_web.sh
      # Set up browser-test Python only after Blender: its LD_LIBRARY_PATH
      # otherwise makes Ubuntu Blender load the hosted Python without apt NumPy.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke test
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test WebGL, touch controls and landscape in browser
        run: python tools/test_v2_browser.py build/web
      - name: Test original story UI and complete iPhone playthrough
        run: python tools/test_story_browser.py build/web
      - name: Upload playable Web build
        uses: actions/upload-artifact@v4
        with:
          name: telanico-3d-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Upload editable models
        uses: actions/upload-artifact@v4
        with:
          name: telanico-web-source-models
          path: |
            blender/generated/overworld.blend
            godot/assets/generated/overworld.glb
            blender/generated/overworld_layout.json
            blender/generated/courier.blend
            godot/assets/generated/courier.glb
          if-no-files-found: error
          retention-days: 14
      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telanico-web-test-evidence
          path: |
            build/logs/
            build/screenshots/
          if-no-files-found: warn
          retention-days: 14
