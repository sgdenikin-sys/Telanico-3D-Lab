name: Import tested 3D Web build
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful private Godot Web playable run ID (optional release-pin override)'
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test importer failure safety
        run: python3 tools/test_import_preview.py
      - name: Import newest tested allowlisted V2 candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.TELANICO_LAB_ARTIFACT_TOKEN }}
          TELANICO_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 tools/import_preview.py
      - name: Commit verified public runtime snapshot
        if: steps.candidate.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site
          git commit -m 'Publish tested Telanico V2 ${{ steps.candidate.outputs.commit }}'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.candidate.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.candidate.outputs.changed == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.candidate.outputs.changed == 'true'
      - name: Verify actual HTTPS build and WebGL runtime
        if: steps.candidate.outputs.changed == 'true'
        env:
          EXPECTED_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url='https://sgdenikin-sys.github.io/Telanico-3D-Web/'
          expected=os.environ['EXPECTED_COMMIT']
          for attempt in range(12):
              try:meta=json.load(urllib.request.urlopen(url+'build.json?verify='+expected))
              except (urllib.error.URLError,json.JSONDecodeError):meta={}
              if meta.get('commit')==expected:break
              time.sleep(5)
          assert meta['commit']==expected and meta['version']=='telanico-v2.2',meta
          assert meta['camera_elevation_above_horizontal']==40 and meta['camera_projection']=='orthographic',meta
          Path('hosted-evidence').mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader'])
              for width,height in [(1440,900),(844,390)]:
                  phone=width==844
                  context=browser.new_context(viewport={'width':width,'height':height},has_touch=phone,
                      **({'user_agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'} if phone else {}))
                  page=context.new_page()
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('response',lambda r:errors.append(f'HTTP {r.status}: {r.url}') if r.status>=400 else None)
                  page.on('console',lambda m:errors.append(m.text) if 'ERROR:' in m.text else None)
                  page.goto(url+'?test=1&story_test=1&build='+expected,wait_until='domcontentloaded')
                  page.wait_for_function('window.__TELANICO_STORY?.screen==="intro"',polling=250,timeout=180000)
                  state=page.evaluate('window.__TELANICO_STATE')
                  assert state['commit']==expected and len(state['sites'])==15,state
                  def press(key):
                      page.wait_for_function('(key)=>window.__TELANICO_STORY.controls.some(b=>!b.disabled&&(b.text===key||b.art===key))',arg=key,timeout=120000)
                      point=page.evaluate("""async key=>{
                          let frame=-1,previous='',stable=0;
                          const until=performance.now()+120000;
                          while(performance.now()<until){
                              const s=window.__TELANICO_STORY;
                              const b=s?.controls.find(b=>!b.disabled&&(b.text===key||b.art===key));
                              if(b&&s.frame!==frame){const next=JSON.stringify(b.rect);stable=next===previous?stable+1:0;previous=next;frame=s.frame;
                                  if(stable>=1){const r=document.querySelector('#canvas').getBoundingClientRect();return {x:r.x+(b.rect[0]+b.rect[2]/2)/s.viewport[0]*r.width,y:r.y+(b.rect[1]+b.rect[3]/2)/s.viewport[1]*r.height};}}
                              await new Promise(r=>setTimeout(r,150));
                          }throw Error('Unstable hosted story control '+key);
                      }""",key)
                      (page.touchscreen.tap if phone else page.mouse.click)(point['x'],point['y'])
                  press('CHOOSE YOUR ROLE')
                  page.wait_for_function('window.__TELANICO_STORY.screen==="characters"',timeout=120000)
                  press('SELECT COOPER')
                  page.wait_for_function('window.__TELANICO_STORY.modal==="invoice"',timeout=120000)
                  story=page.evaluate('window.__TELANICO_STORY')
                  assert story['time']==0 and story['invoice']['cargo']=='High Quality Energy (Physical Oil)',story
                  assert story['invoice']['quantity']=='' and story['invoice']['total']=='',story
                  press('button_close_invoice.png')
                  page.wait_for_function('window.__TELANICO_STORY.modal==="assistant"',timeout=120000)
                  press('CONTINUE')
                  page.wait_for_function('!window.__TELANICO_STORY.locked',timeout=120000)
                  frame=page.evaluate('window.__TELANICO_STATE.frame')
                  page.wait_for_function('(f)=>window.__TELANICO_STATE.frame>f+2',arg=frame,timeout=180000)
                  page.screenshot(path=f'hosted-evidence/v22-started-{width}.png',timeout=120000)
                  assert not errors,errors
                  context.close()
              browser.close()
          print('LIVE_V22_STORY_HTTPS_WEBGL_VERIFIED',expected,url)
          PY
      - name: Upload hosted V2.2 verification screenshots
        if: always() && steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-v22-verification
          path: hosted-evidence/
          if-no-files-found: ignore
